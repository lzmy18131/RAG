# RAG docker-compose（CPU profile 可启动；Demo 模式无需 API key / GPU / 模型下载）
# Milvus Lite 单进程：仅 1 个 backend 副本
#
# 一键 Demo：DEMO_MODE=true docker compose up --build
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      MILVUS_URI: ${MILVUS_URI:-/app/storage/milvus.db}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-replace-me}
      VLM_BASE_URL: ${VLM_BASE_URL:-https://your-vlm-endpoint/v1}
      VLM_API_KEY: ${VLM_API_KEY:-replace-me}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-large}
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      # 模型缓存卷挂载到 HF_HOME（非 root 用户可写）
      HF_HOME: /models
    volumes:
      - rag-data:/app/storage
      - rag-models:/models   # 模型权重缓存（HF_HOME；rag 用户可写）
      - rag-runs:/app/runs
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rag-data:
  rag-models:
  rag-runs:
