name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_online_evals:
        description: "Run online LLM/RAGAS evals (needs API keys)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + typecheck + test + coverage + offline eval)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      # CI 绝不调用真实 LLM / VLM / 不下载大模型
      DEMO_MODE: "true"
      CACHE_DB_PATH: /tmp/cache.db
      STORAGE_DIR: /tmp/storage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev,eval]" --extra-index-url https://pypi.org/simple

      - name: Ruff check
        run: ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/

      - name: Typecheck (mypy — fail 即 fail)
        run: mypy src

      - name: Pytest + coverage (offline subset + demo mode, 无 GPU/模型/API)
        run: |
          pytest tests/ -q -k "not test_phase3 and not test_phase4 and not test_phase5 \
            and not test_phase7_integration and not milvus_collection" \
            --cov=src --cov-branch --cov-report=term-missing

      - name: Offline retrieval eval (demo corpus, real pipeline)
        run: python scripts/demo_retrieval_eval.py

      - name: Eval datasets build (deterministic)
        run: python scripts/build_evals_datasets.py

      - name: Security audit (pip)
        run: pip install pip-audit && pip-audit
        continue-on-error: true

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest + RTL)
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit (npm)
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: E2E (Playwright, Demo Mode — 无 API key / GPU)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        run: pip install -e ".[dev]" --extra-index-url https://pypi.org/simple
      - name: Install frontend + Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      # webServer（playwright.config.ts）自动以 DEMO_MODE=true 启动后端与前端
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test

  docker:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t rag-backend:ci -f Dockerfile .
      - name: Build frontend image
        run: docker build -t rag-frontend:ci -f frontend/Dockerfile ./frontend

  full-eval:
    name: Full retrieval eval (workflow_dispatch only — 需 MILVUS_URI + 模型)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,eval]" --extra-index-url https://pypi.org/simple
      - name: Run retrieval eval (needs MILVUS_URI + models via secrets)
        env:
          MILVUS_URI: ${{ secrets.MILVUS_URI }}
          RUN_ONLINE_EVALS: ${{ github.event.inputs.run_online_evals || 'false' }}
        # 无 MILVUS_URI / 无 key → SKIPPED（脚本内检测）；有 key 真失败则 FAILED
        run: python scripts/final_evaluation.py --retrieval-only --dataset golden_100
